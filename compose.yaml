name: bovina
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: bovina
      POSTGRES_USER: bovina_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the local bootstrap password}
      BOVINA_MIGRATION_PASSWORD: ${BOVINA_MIGRATION_PASSWORD:?Set the migration password}
      BOVINA_RUNTIME_PASSWORD: ${BOVINA_RUNTIME_PASSWORD:?Set the runtime password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/bootstrap.sh:/docker-entrypoint-initdb.d/10-bovina.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bovina_bootstrap -d bovina"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    image: bovina:phase0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bovina
      SPRING_DATASOURCE_USERNAME: bovina_runtime
      SPRING_DATASOURCE_PASSWORD: ${BOVINA_RUNTIME_PASSWORD:?Set the runtime password}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/bovina
      SPRING_FLYWAY_USER: bovina_migration
      SPRING_FLYWAY_PASSWORD: ${BOVINA_MIGRATION_PASSWORD:?Set the migration password}
      BOVINA_SECURITY_ISSUER: ${BOVINA_SECURITY_ISSUER:?Set the trusted issuer}
      BOVINA_SECURITY_JWK_SET_URI: ${BOVINA_SECURITY_JWK_SET_URI:?Set the JWKS URI}
      BOVINA_SECURITY_AUDIENCE: ${BOVINA_SECURITY_AUDIENCE:?Set the API audience}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 40s

volumes:
  postgres-data:
