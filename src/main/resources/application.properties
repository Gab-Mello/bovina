spring.application.name=bovina
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
logging.structured.format.console=logstash
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
bovina.outcomes.d30.target-day=30
bovina.outcomes.d30.from-day=25
bovina.outcomes.d30.through-day=35
bovina.outcomes.d60.target-day=60
bovina.outcomes.d60.from-day=55
bovina.outcomes.d60.through-day=65
bovina.distribution.regulated-dispatch=${BOVINA_DISTRIBUTION_REGULATED_DISPATCH:true}
