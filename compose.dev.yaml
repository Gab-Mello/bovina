services:
  dev-auth:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.6
    environment:
      JSON_CONFIG: >-
        {"interactiveLogin":false,"tokenCallbacks":[{"issuerId":"default","tokenExpiry":3600,"requestMappings":[{"requestParam":"client_id","match":"bovina-local","claims":{"sub":"dev-operator","aud":["bovina"]}}]}]}
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/isalive"]
      start_period: 5s
      interval: 2s
      timeout: 2s
      retries: 10

  api:
    depends_on:
      dev-auth:
        condition: service_healthy
