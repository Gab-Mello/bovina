name: Verify

on:
  pull_request:
  push:
    branches: [feature/pive-domain-v2, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify unit, architecture, PostgreSQL and migration tests
        run: ./mvnw -B -ntp clean verify
      - name: Build the runtime image
        run: docker build --tag bovina:phase0 .
      - name: Verify Compose, probes, restart and restore
        run: bash scripts/phase0-runtime-smoke.sh
